services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_class_management
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${DB_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    networks:
      - class_management_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_POSTGRES:-1.0}'
          memory: ${MEM_LIMIT_POSTGRES:-512m}
        reservations:
          memory: 256m

  redis_cache:
    image: redis:7-alpine
    container_name: redis_class_management
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --appendonly yes
      --save 900 1
      --save 300 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_PATH:-redis_data}:/data
    networks:
      - class_management_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_REDIS:-0.5}'
          memory: ${MEM_LIMIT_REDIS:-256m}
        reservations:
          memory: 128m

volumes:
  postgres_data:
  redis_data:

networks:
  class_management_network:
    driver: bridge
